# --kubelet-insecure-tls: Talos does issue real, rotated kubelet certs (unlike kubeadm
# clusters, which is why this isn't needed for cluster security in general), but
# metrics-server's TLS validation against the kubelet commonly fails anyway because the
# kubelet cert's SANs don't reliably cover whichever address type metrics-server picks to
# connect on -- a well-documented Talos+metrics-server gotcha (see
# docs.siderolabs.com/kubernetes-guides/monitoring-and-observability/deploy-metrics-server).
# Connections are still TLS-encrypted, just not certificate-validated -- acceptable for
# internal-only cluster metrics (kubectl top / k9s), not exposed outside the cluster.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: metrics-server
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    args:
      - --kubelet-insecure-tls
      - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    # Single node for now -- 2 replicas would just co-schedule on the same box, no real
    # HA gained from it. Bump once node 2 exists.
    replicas: 1

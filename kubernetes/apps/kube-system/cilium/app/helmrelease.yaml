apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: "1.20.x"
      sourceRef:
        kind: HelmRepository
        name: cilium
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Talos: kube-proxy is disabled in talos/talconfig.yaml (cluster.proxy.disabled),
    # Cilium replaces it entirely.
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445 # Talos KubePrism — reachable on every node before CNI is up

    ipam:
      mode: kubernetes

    # 2 replicas (chart default) can't both schedule on one node -- blocks helm --wait.
    operator:
      replicas: 1
      # rollOutPods: true    # multi-node only
      # prometheus:          # no prometheus stack yet
      #   enabled: true
      # dashboards:          # no grafana yet
      #   enabled: true
    # rollOutCiliumPods: true  # multi-node only

    # Talos: cgroups are already mounted, Cilium must not try to remount them.
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    # LB-IPAM + L2 announcements — this is the MetalLB replacement (see
    # ippool.yaml / l2announcementpolicy.yaml for the actual pool/policy).
    l2announcements:
      enabled: true
    externalIPs:
      enabled: true
    # bgpControlPlane:     # L2 alt; needs a BGP router, Nokia ISP gateway can't
    #   enabled: true

    # routingMode: native          # needs BGP to route pod/service CIDRs
    # autoDirectNodeRoutes: true   # native routing only
    # ipv4NativeRoutingCIDR: ...   # native routing only
    # devices: bond+               # onedr0p's bonded NICs, we don't bond

    # loadBalancer:          # DSR perf tuning, not needed at this scale
    #   algorithm: maglev
    #   mode: dsr
    # bandwidthManager:      # BBR perf tuning, skip for now
    #   enabled: true
    #   bbr: true
    # enableIPv4BIGTCP: true # perf tuning, skip for now
    # bpfClockProbe: true    # perf tuning, skip for now
    # endpointRoutes:        # perf tuning, skip for now
    #   enabled: true
    # pmtuDiscovery:         # perf tuning, skip for now
    #   enabled: true
    # bpf:                   # tuning defaults are fine as-is
    #   datapathMode: veth
    #   masquerade: true
    #   preallocateMaps: true

    # cni:              # exclusive CNI here, no chaining needed
    #   exclusive: false
    # localRedirectPolicies:  # not using this feature
    #   enabled: true
    # kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256  # not scraped, no healthz consumer

    # Gateway API is implemented by Envoy Gateway (kubernetes/apps/networking/envoy-gateway),
    # not Cilium's own implementation.
    gatewayAPI:
      enabled: false
    envoy: # Cilium's own L7 proxy, unused (see gatewayAPI above)
      enabled: false
    hubble: # not using flow visibility yet
      enabled: false

    # prometheus:          # no prometheus stack yet
    #   enabled: true
    #   serviceMonitor:
    #     enabled: true
    #     trustCRDsExist: true
    # dashboards:          # no grafana yet
    #   enabled: true

    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
          # - PERFMON  # BIG TCP/bandwidthManager only, unused
          # - BPF      # same
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    # fixes forwarded (non-socket) traffic e.g. tailscale subnet router
    socketLB:
      enabled: true
      hostNamespaceOnly: true

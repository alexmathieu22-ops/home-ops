apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: "1.18.x"
      sourceRef:
        kind: HelmRepository
        name: cilium
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Talos: kube-proxy is disabled in talos/talconfig.yaml (cluster.proxy.disabled),
    # Cilium replaces it entirely.
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445 # Talos KubePrism — reachable on every node before CNI is up

    ipam:
      mode: kubernetes

    # cilium-operator's control-plane work (IPAM/LB allocation) doesn't need HA at this
    # scale -- and the chart's default of 2 replicas actively breaks Helm's readiness
    # wait on a single-node cluster (both replicas share the same hostPorts, so the
    # second can never schedule, and `helm upgrade --wait` blocks forever). Single
    # instance, matching the same "no HA needed at homelab scale" call already made for
    # Loki (SingleBinary mode).
    operator:
      replicas: 1

    # Talos: cgroups are already mounted, Cilium must not try to remount them.
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    # LB-IPAM + L2 announcements — this is the MetalLB replacement (see
    # ippool.yaml / l2announcementpolicy.yaml for the actual pool/policy).
    l2announcements:
      enabled: true
    externalIPs:
      enabled: true

    # Gateway API is implemented by Envoy Gateway (kubernetes/apps/networking/envoy-gateway),
    # not Cilium's own implementation.
    gatewayAPI:
      enabled: false

    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: false

# bjw-s app-template, not a community chart (Rancher doesn't publish one -- see
# rancher/local-path-provisioner#89) -- see IMPLEMENTATION_NOTES.md ("Storage") for the
# interim-storage rationale. RBAC/ConfigMap/StorageClass are hand-written below as
# extraObjects, matching upstream's own raw deploy manifest 1:1
# (rancher/local-path-provisioner deploy/local-path-storage.yaml) rather than any
# third-party packaging of it. NOT YET LIVE-VERIFIED -- confirm the provisioner actually
# binds PVCs after first reconcile (`kubectl get pods -n kube-system`,
# `kubectl get storageclass`).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: kube-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: local-path-provisioner
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: local-path-provisioner
    controllers:
      main:
        containers:
          main:
            image:
              repository: docker.io/rancher/local-path-provisioner
              tag: v0.0.36
            command:
              - local-path-provisioner
              - --debug
              - start
              - --config
              - /etc/config/config.json
            env:
              POD_NAMESPACE:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              CONFIG_MOUNT_PATH: /etc/config/
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                memory: 64Mi
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/config/
    # Verbatim from upstream's local-path-config ConfigMap (setup/teardown/helperPod.yaml
    # are the helper-pod scripts local-path-provisioner spawns per PVC to create/remove
    # the backing directory) -- see IMPLEMENTATION_NOTES.md for the /var path rationale.
    configMaps:
      config:
        data:
          config.json: |
            {
                    "nodePathMap":[
                    {
                            "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                            "paths":["/var/local-path-provisioner"]
                    }
                    ]
            }
          setup: |-
            #!/bin/sh
            set -eu
            mkdir -m 0777 -p "$VOL_DIR"
          teardown: |-
            #!/bin/sh
            set -eu
            rm -rf "$VOL_DIR"
          helperPod.yaml: |-
            apiVersion: v1
            kind: Pod
            metadata:
              name: helper-pod
            spec:
              priorityClassName: system-node-critical
              tolerations:
                - key: node.kubernetes.io/disk-pressure
                  operator: Exists
                  effect: NoSchedule
              containers:
              - name: helper-pod
                image: docker.io/library/busybox
                imagePullPolicy: IfNotPresent
    # Cluster-scoped RBAC (PV/StorageClass/node watch) + namespaced RBAC (helper pod
    # lifecycle) + the StorageClass itself -- app-template's default ServiceAccount
    # (named "local-path-provisioner" via fullnameOverride above) is the subject for both
    # bindings.
    extraObjects:
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: local-path-provisioner
        rules:
          - apiGroups: [""]
            resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods", "pods/log"]
            verbs: ["get", "list", "watch"]
          - apiGroups: [""]
            resources: ["persistentvolumes"]
            verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
          - apiGroups: [""]
            resources: ["events"]
            verbs: ["create", "patch"]
          - apiGroups: ["storage.k8s.io"]
            resources: ["storageclasses"]
            verbs: ["get", "list", "watch"]
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: local-path-provisioner
        subjects:
          - kind: ServiceAccount
            name: local-path-provisioner
            namespace: kube-system
        roleRef:
          kind: ClusterRole
          name: local-path-provisioner
          apiGroup: rbac.authorization.k8s.io
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: local-path-provisioner
          namespace: kube-system
        rules:
          - apiGroups: [""]
            resources: ["pods"]
            verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: local-path-provisioner
          namespace: kube-system
        subjects:
          - kind: ServiceAccount
            name: local-path-provisioner
            namespace: kube-system
        roleRef:
          kind: Role
          name: local-path-provisioner
          apiGroup: rbac.authorization.k8s.io
      - apiVersion: storage.k8s.io/v1
        kind: StorageClass
        metadata:
          name: local-path
          annotations:
            storageclass.kubernetes.io/is-default-class: "true"
        provisioner: rancher.io/local-path
        reclaimPolicy: Delete
        volumeBindingMode: WaitForFirstConsumer

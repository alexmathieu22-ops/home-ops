# bjw-s app-template, not a community chart (Rancher doesn't publish one -- see
# rancher/local-path-provisioner#89) -- see IMPLEMENTATION_NOTES.md ("Storage") for the
# interim-storage rationale. RBAC/ConfigMap/StorageClass are hand-written below using
# app-template 5.x's rbac/rawResources keys (NOT extraObjects -- that key doesn't exist in
# this chart version and silently no-ops), matching upstream's own raw deploy manifest 1:1
# (rancher/local-path-provisioner deploy/local-path-storage.yaml) rather than any
# third-party packaging of it. defaultPodOptions.automountServiceAccountToken must be set
# true -- app-template defaults it to false, which breaks in-cluster auth for controllers
# like this one that talk to the API server.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: kube-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: local-path-provisioner
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: local-path-provisioner
    defaultPodOptions:
      automountServiceAccountToken: true
    controllers:
      main:
        containers:
          main:
            image:
              repository: docker.io/rancher/local-path-provisioner
              tag: v0.0.36
            command:
              - local-path-provisioner
              - --debug
              - start
              - --config
              - /etc/config/config.json
              # local-path-provisioner reads the helper pod template from a ConfigMap it
              # looks up by name via the API (default "local-path-config"), separate from
              # the --config file above -- must match the actual ConfigMap name, which
              # app-template derives from fullnameOverride.
              - --configmap-name
              - local-path-provisioner
            env:
              POD_NAMESPACE:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              CONFIG_MOUNT_PATH: /etc/config/
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                memory: 64Mi
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/config/
    # Verbatim from upstream's local-path-config ConfigMap (setup/teardown/helperPod.yaml
    # are the helper-pod scripts local-path-provisioner spawns per PVC to create/remove
    # the backing directory) -- see IMPLEMENTATION_NOTES.md for the /var path rationale.
    configMaps:
      config:
        data:
          config.json: |
            {
                    "nodePathMap":[
                    {
                            "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                            "paths":["/var/local-path-provisioner"]
                    }
                    ]
            }
          setup: |-
            #!/bin/sh
            set -eu
            mkdir -m 0777 -p "$VOL_DIR"
          teardown: |-
            #!/bin/sh
            set -eu
            rm -rf "$VOL_DIR"
          helperPod.yaml: |-
            apiVersion: v1
            kind: Pod
            metadata:
              name: helper-pod
            spec:
              priorityClassName: system-node-critical
              tolerations:
                - key: node.kubernetes.io/disk-pressure
                  operator: Exists
                  effect: NoSchedule
              containers:
              - name: helper-pod
                image: docker.io/library/busybox
                imagePullPolicy: IfNotPresent
    # Cluster-scoped RBAC (PV/StorageClass/node watch) + namespaced RBAC (helper pod
    # lifecycle) + the StorageClass itself -- app-template's default ServiceAccount
    # (named "local-path-provisioner" via fullnameOverride above) is the subject for both
    # bindings, referenced by name/namespace rather than by "identifier" since it's created
    # implicitly (no serviceAccount: block below).
    rbac:
      roles:
        local-path-provisioner:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods", "pods/log"]
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["persistentvolumes"]
              verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
            - apiGroups: [""]
              resources: ["events"]
              verbs: ["create", "patch"]
            - apiGroups: ["storage.k8s.io"]
              resources: ["storageclasses"]
              verbs: ["get", "list", "watch"]
        local-path-provisioner-pods:
          type: Role
          rules:
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
      bindings:
        local-path-provisioner:
          type: ClusterRoleBinding
          roleRef:
            identifier: local-path-provisioner
          subjects:
            - name: local-path-provisioner
              kind: ServiceAccount
              namespace: kube-system
        local-path-provisioner-pods:
          type: RoleBinding
          roleRef:
            identifier: local-path-provisioner-pods
          subjects:
            - name: local-path-provisioner
              kind: ServiceAccount
              namespace: kube-system
    # forceRename is required: rawResources ignores manifest.metadata.name and derives the
    # object name from fullnameOverride unless forced.
    rawResources:
      storageclass:
        forceRename: local-path
        manifest:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
          provisioner: rancher.io/local-path
          reclaimPolicy: Delete
          volumeBindingMode: WaitForFirstConsumer

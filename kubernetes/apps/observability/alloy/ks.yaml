apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: observability
  dependsOn:
    - name: loki
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/observability/alloy/app

# Privileged PodSecurity scoped to this namespace only, for node-exporter's hostNetwork/
# hostPID/hostPath/hostPort needs (reads host-level metrics) -- same pattern as
# kubernetes/apps/rook-ceph/namespace.yaml. Without this, Talos's cluster-wide baseline
# PSA default blocks the DaemonSet's pods outright ("violates PodSecurity
# baseline:latest: host namespaces, hostPath volumes, hostPort").
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

# Adapted from buroa/k8s-gitops's gatus-sidecar auto-discovery pattern, not copied:
# no ServiceMonitor (no Prometheus here), no Reloader annotation (not installed), no
# alerting secretRef (not wired up yet), image pinned by tag only (no digest -- not
# verified from here).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: observability
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gatus
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: gatus
    controllers:
      gatus:
        # Native sidecar (initContainer + restartPolicy: Always): starts before the main
        # container, watches HTTPRoutes cluster-wide, writes discovered endpoints to
        # /config/gatus-sidecar.yaml. Gatus merges every *.yaml under GATUS_CONFIG_PATH
        # (a directory, not a single file) and hot-reloads on change -- no restart needed
        # when apps come and go. --gateway-name covers BOTH Gateways (not just external,
        # unlike buroa's public-only setup) since this status page's job is general "is
        # anything down" awareness, not just public uptime -- narrow to just `external`
        # later if a fully public status page shouldn't reveal internal-only app names.
        initContainers:
          gatus-sidecar:
            image:
              repository: ghcr.io/home-operations/gatus-sidecar
              tag: "0.4.1"
            args:
              - --auto-httproute
              - --enable-httproute
              - --gateway-name=external
              - --gateway-name=internal
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
            restartPolicy: Always
        containers:
          app:
            image:
              repository: ghcr.io/twin/gatus
              tag: v5.36.0
            env:
              GATUS_CONFIG_PATH: /config
            # Gatus's web port is set via config.yaml's web.port (resources/config.yaml),
            # not an env var -- GATUS_WEB_PORT doesn't exist and was silently ignored
            # (verified: image always binds 8080 regardless). This anchor just keeps the
            # probe/service ports in sync with that config.yaml value.
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 80
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    # Manually-defined base config (no endpoints list -- those now come from the
    # sidecar). The kubernetes-api self-check stays here since it isn't something an
    # HTTPRoute would ever produce; Gatus appends/merges endpoint lists across files
    # under GATUS_CONFIG_PATH rather than one file overwriting the other.
    persistence:
      config:
        type: emptyDir
        advancedMounts:
          gatus:
            app:
              - path: /config
            gatus-sidecar:
              - path: /config
      config-file:
        type: configMap
        name: gatus-configmap
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true
    route:
      app:
        # Excludes Gatus's own status page from --auto-httproute so it doesn't
        # monitor itself.
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "{{ .Release.Name }}.alexandremathieu.com"
          - status.alexandremathieu.com
        parentRefs:
          - name: external
            namespace: networking
            sectionName: http
      # Internal-only exposure alongside the external one, to verify the internal Gateway
      # (adguard-home rewrite -> Envoy) path end-to-end -- a separate route/hostname rather
      # than adding "internal" as a second parentRef on route.app, since hostnames are
      # shared across all parentRefs on one HTTPRoute and app's are public domain names.
      app-internal:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - gatus.internal.alexandremathieu.com
        parentRefs:
          - name: internal
            namespace: networking
            sectionName: https
    service:
      app:
        controller: gatus
        ports:
          http:
            port: *port
    # gatus-sidecar needs cluster-wide read on HTTPRoutes/Gateways to watch them -- see
    # IMPLEMENTATION_NOTES.md. Scoped to just what we actually use (no Ingress/Service/
    # Traefik IngressRoute discovery, unlike gatus-sidecar's own upstream RBAC example).
    rbac:
      roles:
        gatus-sidecar:
          # Without forceRename, app-template drops the map-key suffix when a
          # map has only one entry, naming this ClusterRole "gatus" (the
          # fullnameOverride) instead of "gatus-sidecar".
          forceRename: gatus-sidecar
          type: ClusterRole
          rules:
            - apiGroups: ["gateway.networking.k8s.io"]
              resources: ["httproutes", "gateways"]
              verbs: ["get", "list", "watch"]
      bindings:
        gatus-sidecar:
          forceRename: gatus-sidecar
          type: ClusterRoleBinding
          roleRef:
            identifier: gatus-sidecar
          subjects:
            - name: gatus
              kind: ServiceAccount
              namespace: observability

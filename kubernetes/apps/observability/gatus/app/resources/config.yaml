web:
  port: 80

ui:
  title: home-ops status

endpoints:
  - name: kubernetes-api
    group: internal
    url: https://kubernetes.default.svc.cluster.local
    interval: 60s
    client:
      insecure: true
    # Gatus conditions are ANDed, not ORed -- three separate [STATUS] == N entries can
    # never all be true for one response, so this always failed. any() is Gatus's OR.
    conditions:
      - "[STATUS] == any(200, 401, 403)"

  - name: google
    group: external
    url: icmp://8.8.8.8
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

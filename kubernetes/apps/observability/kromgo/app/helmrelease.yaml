# Renders README badges from live cluster metrics. Flux version isn't `flux_instance_info`
# -- that metric only exists with fluxcd/flux-operator, and this repo runs classic
# self-managed Flux (`flux bootstrap github`) -- so it's derived from kube-state-metrics'
# container image tag instead.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kromgo
  namespace: observability
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kromgo
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    config:
      prometheus: http://prometheus-operated.observability.svc.cluster.local:9090
      badges:
        - title: Talos
          id: talos_version
          query: label_replace(node_os_info{name="Talos"}, "version_id", "$1", "version_id", "v(.+)")
          valueExpr: labels["version_id"]
          icon: si:talos

        - title: Kubernetes
          id: kubernetes_version
          query: label_replace(kubernetes_build_info{service="kubernetes"}, "git_version", "$1", "git_version", "v(.+)")
          valueExpr: labels["git_version"]
          icon: si:kubernetes

        - title: Flux
          id: flux_version
          query: label_replace(kube_pod_container_info{namespace="flux-system", container="manager", image=~".*source-controller.*"}, "version", "$1", "image", ".*:(v[0-9.]+)$")
          valueExpr: labels["version"]
          icon: si:flux

        - title: Nodes
          id: cluster_node_count
          query: count(count by (node) (kube_node_status_condition{condition="Ready"}))
          colorExpr: '"green"'

        - title: Pods
          id: cluster_pod_count
          query: sum(kube_pod_status_phase{phase="Running"})
          valueExpr: humanizeCommas(result)
          colorExpr: '"green"'

        - title: CPU
          id: cluster_cpu_usage
          query: round(100 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'

        - title: Memory
          id: cluster_memory_usage
          query: round((1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'

        - title: Age
          id: cluster_birth_age
          query: round(time() - min(kube_node_created))
          valueExpr: humanizeDurationDays(result)
          colorExpr: 'colorScale(result, [15552000.0, 31104000.0], ["green", "orange", "red"])'

        - title: Uptime
          id: cluster_uptime_age
          query: round(avg(node_time_seconds - node_boot_time_seconds))
          valueExpr: humanizeDurationDays(result)
          colorExpr: 'colorScale(result, [15552000.0, 31104000.0], ["green", "orange", "red"])'
    httpRoute:
      enabled: true
      parentRefs:
        - name: external
          namespace: networking
          sectionName: http
      hostnames:
        - kromgo.alexandremathieu.com
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi

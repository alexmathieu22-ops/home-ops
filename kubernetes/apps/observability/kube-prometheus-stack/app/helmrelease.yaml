# Minimal slice of what onedr0p/buroa run: Prometheus + kube-state-metrics + node-exporter
# only, to feed kromgo's badges. No Grafana (no dashboards needed here), no Alertmanager
# (nothing alerts on it yet, and it's only what kromgo's own "Alerts" badge would need --
# dropped for now, see kromgo's helmrelease). Extends
# docs/adr/observability/2026-08-13-gatus-instead-of-prometheus-loki.md now that node 2
# exists (that ADR's own stated trigger) -- see
# docs/adr/observability/2026-08-22-minimal-prometheus-for-kromgo.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: kube-prometheus-stack
    crds:
      enabled: true
    alertmanager:
      enabled: false
    grafana:
      enabled: false
    kubeProxy:
      # Cilium replaces kube-proxy (see docs/adr/talos/2026-08-01-disable-kube-proxy-for-cilium.md) -- nothing to scrape.
      enabled: false
    kubeStateMetrics:
      enabled: true
    nodeExporter:
      enabled: true
    prometheusOperator:
      enabled: true
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 128Mi
    prometheus:
      prometheusSpec:
        replicas: 1
        # Short retention, no persistence: kromgo only ever queries the *current* value,
        # never history, and Rook-Ceph has 0 usable OSDs right now anyway (see README Stack
        # table) so a PVC isn't even an option yet. storageSpec left empty -> emptyDir;
        # losing this on a pod restart is a non-issue for that use case.
        retention: 6h
        storageSpec: {}
        resources:
          requests:
            cpu: 50m
          limits:
            memory: 512Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 128Mi
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 64Mi

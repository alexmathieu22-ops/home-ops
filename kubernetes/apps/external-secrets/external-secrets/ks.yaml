# The ClusterSecretStore CRD comes from this component's own HelmRelease, so ./config
# gets its own dependent Kustomization -- same CRD/CR race as cilium/cilium-config.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: external-secrets
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/external-secrets/external-secrets/app
---
# wait: true (matching onedr0p/home-ops and buroa/k8s-gitops's actual convention) is
# correct here: the ClusterSecretStore genuinely can't go healthy until 1Password exists
# (PROJECT_BRIEF.md "Deferred"), so staying not-Ready accurately reflects that -- it's
# not blocking unrelated phases, just this component's own dependents, which themselves
# need 1Password too. healthCheckExprs (same pattern as the reference repos) checks the
# real Ready condition explicitly rather than relying on Flux's generic auto-detection.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-config
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: external-secrets
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  dependsOn:
    - name: external-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/external-secrets/external-secrets/config

# 1Password Service Account + the SDK provider (not 1Password Connect, not Vaultwarden —
# see PROJECT_BRIEF.md). `onepasswordSDK` is ESO's newer provider surface (as opposed to
# the older Connect-server-based `onepassword` provider) — double check the exact field
# name/shape against the installed ESO chart version's CRD if this fails to reconcile,
# since this provider is newer than this repo's knowledge cutoff can fully guarantee.
#
# References the Secret pushed once by terraform/bootstrap (docs/runbooks/secret-zero.md).
# DEFERRED: the 1Password vault named below doesn't exist yet — this ClusterSecretStore
# will stay not-Ready until it does.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: infra # TODO: real 1Password vault name once it exists
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account-token
          namespace: external-secrets
          key: token

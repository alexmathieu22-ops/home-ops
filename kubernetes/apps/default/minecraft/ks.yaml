apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minecraft
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: default
  dependsOn:
    - name: local-path-provisioner
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/default/minecraft/app

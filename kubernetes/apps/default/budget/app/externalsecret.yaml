# Pull credentials for the private ghcr.io/alexmathieu22/budget image. 1Password item
# `ghcr-pull-token`: `username` = the GitHub user, `credential` = a classic PAT with only
# read:packages (fine-grained PATs can't read GHCR packages).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: ghcr-pull-token/username
    - secretKey: token
      remoteRef:
        key: ghcr-pull-token/credential

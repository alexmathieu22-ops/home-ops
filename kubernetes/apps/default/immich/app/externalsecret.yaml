# 1Password item `immich`: `db-password` = a random A-Za-z0-9 string (Immich rejects
# special characters). Postgres only reads it at first init, so changing it later means
# also running ALTER USER inside the database.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: immich-secret
    template:
      data:
        DB_PASSWORD: "{{ .password }}"
        POSTGRES_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: immich/db-password

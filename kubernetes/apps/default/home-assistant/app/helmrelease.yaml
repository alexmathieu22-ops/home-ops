# Adapted from onedr0p/home-ops and buroa/k8s-gitops, not copied:
# - No Multus/dedicated IoT VLAN IP (k8s.v1.cni.cncf.io/networks in both references) --
#   this cluster has no Multus CNI or VLAN segmentation. Plain ClusterIP-backed pod.
# - No Gateway API route / Cloudflare Access, unlike either reference. Exposed instead as
#   a LoadBalancer Service straight from Cilium's LB-IPAM -- gets its own LAN IP directly
#   (`kubectl get svc -n default home-assistant-app`), no hostname/DNS/TLS needed. Chosen
#   over the Gateway route because there's no working network-wide internal DNS yet
#   (AdGuard was pulled pending the UniFi gateway project) and because a smart-home panel
#   is more sensitive than a status page to leave path-dependent on that.
# - storageClass: local-path, not ceph-block -- Rook-Ceph has no OSDs deployed yet (same
#   reason headscale-subnet-router uses local-path). Migrate once Ceph is actually live.
# - No ExternalSecret/integration API keys (weather providers, etc. in onedr0p's) -- add
#   if/when specific integrations need them.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: default
spec:
  interval: 1h
  # First boot (venv build + HA's own init) can take longer than Flux's 5m default wait --
  # give it real headroom instead of Helm giving up mid-boot and remediating (uninstall +
  # retry), which was compounding with the venv-rebuild-on-restart issue below.
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: home-assistant
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: home-assistant
    controllers:
      home-assistant:
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.8.1
            env:
              TZ: America/Toronto
            # Matches onedr0p's actual pattern (not buroa's, which shares the strict
            # /healthz check across liveness AND readiness): liveness/startup are plain
            # (no custom/type), which app-template renders as a bare TCP check against the
            # primary port -- lenient, never kills the container just for still booting.
            # Only readiness runs the strict /healthz check; failing it just withholds
            # traffic, it doesn't restart anything. This is what avoided the crash loop my
            # first attempt (custom httpGet on all three) hit: HA's first boot (venv
            # build + init) took longer than the check assumed was "hung".
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8123
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: home-assistant
        type: LoadBalancer
        ports:
          http:
            port: *port
    # .venv stays on the persistent config PVC, NOT on scratch/emptyDir like buroa's
    # reference does -- rebuilding a Python venv from scratch is genuinely slow, and
    # putting it on ephemeral storage meant every crash-restart paid that cost again,
    # compounding with the probe-timing bug above into a self-defeating crash loop
    # (crash -> rebuild venv -> probably crash again before it finishes -> repeat).
    # logs/tts/tmp are still fine as disposable scratch space.
    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: local-path
        globalMounts:
          - path: /config
      scratch:
        type: emptyDir
        advancedMounts:
          home-assistant:
            app:
              - path: /config/logs
                subPath: logs
              - path: /config/tts
                subPath: tts
              - path: /tmp
                subPath: tmp

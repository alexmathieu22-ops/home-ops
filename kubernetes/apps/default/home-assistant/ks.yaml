apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: default
  dependsOn:
    - name: cilium
    # local-path, not ceph-block -- see helmrelease.yaml's persistence.config comment.
    - name: local-path-provisioner
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/default/home-assistant/app

# webhook-receiver is a separate Service from notification-controller's own (see
# gotk-components.yaml) -- it targets the dedicated http-webhook port.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  hostnames:
    - "flux-webhook.alexandremathieu.com"
  parentRefs:
    - name: external
      namespace: networking
      sectionName: http
  rules:
    - backendRefs:
        - name: webhook-receiver
          port: 80

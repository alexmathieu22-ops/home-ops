# Public route to source-controller's webhook-receiver Service (a separate Service from
# notification-controller's own -- see gotk-components.yaml -- targeting the dedicated
# http-webhook port). Reachable once cloudflared's tunnel is live (docs/runbooks/
# cloudflare-setup.md); the HTTPRoute itself has no dependency on that being done.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  hostnames:
    - "flux-webhook.alexandremathieu.com"
  parentRefs:
    - name: external
      namespace: networking
      sectionName: http
  rules:
    - backendRefs:
        - name: webhook-receiver
          port: 80

# DEFERRED: works once the GitHub webhook is created (docs/runbooks/flux-webhook.md) --
# no functional dependency on the still-pending Cloudflare account, since GitHub only
# needs *a* value to sign against; the token can be generated and stored any time.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-webhook-token
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: flux-webhook-token
  data:
    # key name is fixed by the Receiver CRD -- source-controller's webhook handler reads
    # this exact field to validate GitHub's X-Hub-Signature-256 header.
    - secretKey: token
      remoteRef:
        key: flux-webhook-token/credential

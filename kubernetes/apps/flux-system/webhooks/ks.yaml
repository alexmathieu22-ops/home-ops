apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-webhooks
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: flux-system
  dependsOn:
    - name: cilium
    - name: external-secrets-config
    # for the HTTPRoute's parentRef (the external Gateway) to actually exist first
    - name: envoy-gateway-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/flux-system/webhooks/app

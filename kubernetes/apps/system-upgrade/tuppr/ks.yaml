apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tuppr
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: system-upgrade
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/system-upgrade/tuppr/app
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tuppr-upgrades
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: false
  targetNamespace: system-upgrade
  dependsOn:
    - name: tuppr
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/system-upgrade/tuppr/upgrades

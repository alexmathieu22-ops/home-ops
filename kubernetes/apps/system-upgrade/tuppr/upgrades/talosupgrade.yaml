apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
  namespace: system-upgrade
spec:
  # This is what actually drives the live upgrade -- tuppr rolls each node straight
  # over the Talos API once this changes, independent of talos/talconfig.yaml.
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
    version: v1.13.9
  healthChecks:
    # Not HEALTH_OK: this cluster's single-OSD topology is permanently HEALTH_WARN
    # (TOO_FEW_OSDS, POOL_NO_REDUNDANCY -- see rook-ceph/cluster/helmrelease.yaml),
    # so a strict HEALTH_OK check would block upgrades forever.
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: rook-ceph
      namespace: rook-ceph
      expr: status.ceph.health != "HEALTH_ERR"

# wait: false is deliberate: this ExternalSecret can't succeed until 1Password exists,
# and Headscale server hosting itself is separately deferred (PROJECT_BRIEF.md) -- Flux
# would otherwise block this Kustomization forever waiting for its Ready condition.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headscale-subnet-router
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: false
  targetNamespace: networking
  dependsOn:
    - name: rook-ceph-cluster
    - name: external-secrets-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/networking/headscale-subnet-router/app

# wait: true (matching onedr0p/home-ops and buroa/k8s-gitops's convention): this
# ExternalSecret genuinely can't succeed until 1Password exists, and Headscale server
# hosting itself is separately deferred (PROJECT_BRIEF.md) -- staying not-Ready is
# accurate, not a false green.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headscale-subnet-router
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: networking
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  dependsOn:
    - name: rook-ceph-cluster
    - name: external-secrets-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/networking/headscale-subnet-router/app

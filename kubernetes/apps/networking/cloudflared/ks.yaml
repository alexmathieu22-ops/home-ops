# Stays not-Ready until 1Password/Cloudflare exist (PROJECT_BRIEF.md "Deferred") -- accurate, not a bug.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflared
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: networking
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  dependsOn:
    # Needs the ClusterSecretStore object to exist, not just the ExternalSecret CRD.
    - name: external-secrets-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/networking/cloudflared/app

# wait: false is deliberate: this ExternalSecret can't succeed until 1Password/Cloudflare
# exist (PROJECT_BRIEF.md "Deferred") -- Flux would otherwise block this Kustomization
# forever waiting for its Ready condition.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflared
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: false
  targetNamespace: networking
  dependsOn:
    # Needs the ClusterSecretStore object to exist, not just the ExternalSecret CRD.
    - name: external-secrets-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/networking/cloudflared/app

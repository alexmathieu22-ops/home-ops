# DEFERRED: no Cloudflare account/tunnel yet -- see docs/planning/PROJECT_BRIEF.md's "Deferred" list.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel-token
  namespace: networking
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: cloudflared-tunnel-token
  data:
    - secretKey: token
      remoteRef:
        key: cloudflared-tunnel-token/credential

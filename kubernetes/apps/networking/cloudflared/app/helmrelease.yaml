# bjw-s app-template, matching the pattern used for local-path-provisioner/gatus in this
# repo and mirroring onedr0p/home-ops's cloudflare-tunnel HelmRelease. TUNNEL_METRICS/
# --metrics must bind the same port the liveness probe checks -- cloudflared doesn't listen
# anywhere by default, which is what silently crashlooped the previous raw Deployment.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: networking
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cloudflared
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: cloudflared
    controllers:
      cloudflared:
        replicas: 2 # HA — Cloudflare's edge load-balances across connected replicas
        strategy: RollingUpdate # chart default is Recreate, which would drop both replicas at once
        containers:
          app:
            image:
              repository: cloudflare/cloudflared
              tag: 2026.7.3
            args:
              - tunnel
              - --no-autoupdate
              - --metrics
              - 0.0.0.0:2000
              - run
            env:
              TUNNEL_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: cloudflared-tunnel-token
                    key: token
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: 2000
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000

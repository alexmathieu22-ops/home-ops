apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: networking
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Chart-bundled CRDs (Envoy Gateway's own + Gateway API experimental channel) via
    # Helm's native crds/ dir -- see docs/adr/0013-gateway-api-internal-external-split.md.
    crds:
      enabled: true
    config:
      envoyGateway:
        provider:
          type: Kubernetes

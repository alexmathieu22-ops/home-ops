# Two Kustomizations (CRD/CR race) -- see IMPLEMENTATION_NOTES.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: networking
  dependsOn:
    - name: rook-ceph-cluster
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/networking/envoy-gateway/app
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-config
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: networking
  healthCheckExprs:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      failed: status.conditions.filter(e, e.type == 'Programmed').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Programmed').all(e, e.status == 'True')
  dependsOn:
    - name: envoy-gateway
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/networking/envoy-gateway/config

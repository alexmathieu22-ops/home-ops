# GatewayClass/Gateway need the Gateway API CRDs (kubernetes/apps/networking/gateway-api-crds,
# a separate component) as well as the envoy-gateway HelmRelease's own CRDs -- ./config
# dependsOn both.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: networking
  dependsOn:
    - name: rook-ceph-cluster
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/networking/envoy-gateway/app
---
# wait: false is deliberate: the Gateway references a cert-manager ClusterIssuer whose
# DNS01 solver needs a Cloudflare API token from 1Password (both deferred per
# PROJECT_BRIEF.md) -- it won't reach Programmed/Ready until those exist, and Flux
# auto-detects Gateway's standard status conditions, so wait: true would block this
# Kustomization forever.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-config
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: false
  targetNamespace: networking
  dependsOn:
    - name: envoy-gateway
    - name: gateway-api-crds
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/networking/envoy-gateway/config

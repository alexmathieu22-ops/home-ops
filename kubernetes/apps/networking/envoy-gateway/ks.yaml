# GatewayClass/Gateway need the Gateway API CRDs (kubernetes/apps/networking/gateway-api-crds,
# a separate component) as well as the envoy-gateway HelmRelease's own CRDs -- ./config
# dependsOn both.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: networking
  dependsOn:
    - name: rook-ceph-cluster
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/networking/envoy-gateway/app
---
# wait: true (matching onedr0p/home-ops and buroa/k8s-gitops's convention): the Gateway
# references a cert-manager ClusterIssuer whose DNS01 solver needs a Cloudflare API token
# from 1Password (both deferred per PROJECT_BRIEF.md), so it won't reach Programmed until
# those exist -- staying not-Ready is accurate, not a false green. Gateway API uses its
# own condition types (Programmed), not the generic Ready Flux auto-detects for most
# CRDs, hence the explicit healthCheckExprs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-config
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: networking
  healthCheckExprs:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      failed: status.conditions.filter(e, e.type == 'Programmed').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Programmed').all(e, e.status == 'True')
  dependsOn:
    - name: envoy-gateway
    - name: gateway-api-crds
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/networking/envoy-gateway/config

# Public ingress, plain HTTP -- Cloudflare terminates TLS at its edge. See docs/adr/networking/2026-08-16-gateway-api-internal-external-split.md.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: networking
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: external-clusterip
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.alexandremathieu.com"
      allowedRoutes:
        namespaces:
          from: All

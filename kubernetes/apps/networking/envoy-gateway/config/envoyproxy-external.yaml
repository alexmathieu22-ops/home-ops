# Forces the external Gateway's Service to ClusterIP -- see docs/adr/networking/0013-gateway-api-internal-external-split.md.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: external-clusterip
  namespace: networking
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP

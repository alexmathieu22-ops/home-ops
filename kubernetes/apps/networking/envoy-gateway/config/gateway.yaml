# Internal/VPN-only ingress — reachable via the Headscale subnet router, never exposed
# publicly (that's cloudflared's job). Envoy Gateway provisions a LoadBalancer Service
# for this; Cilium LB-IPAM (kubernetes/apps/kube-system/cilium/config/ippool.yaml) assigns it an
# IP from the internal pool automatically.
#
# Matches the ClusterIssuer's DNS zone in
# kubernetes/apps/cert-manager/cert-manager/config/clusterissuer.yaml. Still won't
# actually issue a cert until the Cloudflare API token exists (deferred).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: networking
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.internal.alexandremathieu.com"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.internal.alexandremathieu.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: internal-gateway-tls
      allowedRoutes:
        namespaces:
          from: All

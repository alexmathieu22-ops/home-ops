apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: adguard-home
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: networking
  dependsOn:
    - name: cilium
    # for the web UI's HTTPRoute parentRef (the internal Gateway) to exist first
    - name: envoy-gateway-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/networking/adguard-home/app

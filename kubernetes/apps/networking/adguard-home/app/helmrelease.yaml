# This controller fans out to three Services (main/dns-udp/dns-tcp), so app-template can't
# auto-detect which one the route should hit -- route.main.rules.backendRefs below points
# it at service.main explicitly by identifier.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard-home
  namespace: networking
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: adguard-home
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: adguard-home
    controllers:
      main:
        # Copies the git-sourced config (below) into the writable emptyDir every start --
        # no persistence yet, so this always wins over any UI-driven change. See
        # IMPLEMENTATION_NOTES.md for the persistence/admin-account tradeoff.
        initContainers:
          init-config:
            image:
              repository: docker.io/library/busybox
              tag: "1.37"
            command:
              - sh
              - -c
              - cp /config-seed/AdGuardHome.yaml /opt/adguardhome/conf/AdGuardHome.yaml
        containers:
          main:
            image:
              repository: docker.io/adguard/adguardhome
              tag: v0.107.78
            probes:
              liveness:
                enabled: true
                type: TCP
                port: 3000
              readiness:
                enabled: true
                type: TCP
                port: 3000
              startup:
                enabled: true
                type: TCP
                port: 3000
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 3000
      # One Service for both protocols, not two -- a router's DNS server field is a single
      # IP that needs to answer both UDP and TCP/53 (TCP is used for truncated/large
      # responses). Two separate Services would each get their own LoadBalancer IP from
      # Cilium's IPAM, breaking that.
      dns:
        controller: main
        type: LoadBalancer
        ports:
          udp:
            port: 53
            protocol: UDP
          tcp:
            port: 53
            protocol: TCP
    route:
      main:
        hostnames:
          - "adguard.internal.alexandremathieu.com"
        parentRefs:
          - name: internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: 3000
    configMaps:
      config:
        data:
          AdGuardHome.yaml: |
            # schema_version pinned to skip AdGuardHome's internal config migrator entirely.
            # Confirmed via repeated `docker run` repro: starting from an unversioned file
            # (the natural state of a hand-written seed) silently WIPES the rewrites list
            # partway through the version-0-to-34 migration chain, regardless of correct
            # placement/fields -- this is a real AdGuardHome bug, not a config mistake.
            # Bump this only after checking the target version's migration notes.
            schema_version: 34
            dns:
              bind_hosts:
                - 0.0.0.0
              port: 53
              upstream_dns:
                - https://1.1.1.1/dns-query
                - https://1.0.0.1/dns-query
              # No bootstrap_dns: upstream_dns above already uses literal IPs, so there's no
              # hostname to bootstrap-resolve. Also: AdGuardHome v0.107.78 has a real bug
              # where a flat bootstrap_dns list (`[]string`, the only form its own schema
              # accepts as input) crashes on startup with "cannot construct !!seq into
              # string" -- its early log-settings parser and full config schema disagree on
              # whether the field is `[]string` or `[][]string`. Confirmed via local
              # `docker run` repro against the exact image/tag used here.
            # rewrites belongs under filtering, NOT top-level -- confirmed by inspecting the
            # config AdGuardHome itself writes after adding a rewrite via its own REST API
            # (POST /control/rewrite/add). enabled: true is required per-entry; omitting it
            # is silently treated as invalid and dropped.
            filtering:
              rewrites:
                # REPLACE with the internal Gateway's actual assigned IP: kubectl get gateway -n networking internal
                - domain: "*.internal.alexandremathieu.com"
                  answer: "192.168.18.200"
                  enabled: true
    persistence:
      config-seed:
        type: configMap
        identifier: config
        advancedMounts:
          main:
            init-config:
              - path: /config-seed
                readOnly: true
      conf:
        type: emptyDir
        advancedMounts:
          main:
            init-config:
              - path: /opt/adguardhome/conf
            main:
              - path: /opt/adguardhome/conf
      work:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /opt/adguardhome/work

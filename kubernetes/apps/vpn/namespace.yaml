# Privileged PodSecurity scoped to this namespace only, for headscale-subnet-router's
# NET_ADMIN/NET_RAW + /dev/net/tun needs -- see IMPLEMENTATION_NOTES.md.
apiVersion: v1
kind: Namespace
metadata:
  name: vpn
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

# Plain Tailscale client, not the Tailscale Kubernetes Operator (incompatible with
# self-hosted Headscale) -- see IMPLEMENTATION_NOTES.md ("Networking") for this and the
# TS_KUBE_SECRET/TS_LOGIN_SERVER/advertise-tags gotchas below.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: headscale-subnet-router
  namespace: vpn
spec:
  serviceName: headscale-subnet-router
  replicas: 1
  selector:
    matchLabels:
      app: headscale-subnet-router
  template:
    metadata:
      labels:
        app: headscale-subnet-router
    spec:
      containers:
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.102.2
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: headscale-subnet-router-authkey
                  key: authkey
            - name: TS_ROUTES
              value: "192.168.18.0/24"
            - name: TS_USERSPACE
              value: "false"
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_ACCEPT_DNS
              value: "false"
            # --login-server via TS_EXTRA_ARGS, not TS_LOGIN_SERVER -- see IMPLEMENTATION_NOTES.md.
            - name: TS_EXTRA_ARGS
              value: --login-server=https://headscale.alexandremathieu.com
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: state
              mountPath: /var/lib/tailscale
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi

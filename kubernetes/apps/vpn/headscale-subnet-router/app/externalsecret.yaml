# Headscale runs standalone on an Oracle Cloud VM outside this cluster by design -- see
# docs/runbooks/headscale-oracle-cloud.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-subnet-router-authkey
  namespace: vpn
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: headscale-subnet-router-authkey
  data:
    - secretKey: authkey
      remoteRef:
        key: headscale-subnet-router-authkey/credential

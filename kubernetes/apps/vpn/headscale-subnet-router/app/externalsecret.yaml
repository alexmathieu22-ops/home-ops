# Headscale runs standalone on an Oracle Cloud VM outside this cluster by design (the
# front door to the tailnet shouldn't depend on the cluster it fronts) -- provisioned via
# terraform/headscale, see docs/runbooks/headscale-oracle-cloud.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-subnet-router-authkey
  namespace: vpn
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: headscale-subnet-router-authkey
  data:
    - secretKey: authkey
      remoteRef:
        # onepasswordSDK key format is <item>/[section/]<field>, no separate `property`
        # field (see kubernetes/apps/cert-manager/cert-manager/config/externalsecret.yaml).
        key: headscale-subnet-router-authkey/credential

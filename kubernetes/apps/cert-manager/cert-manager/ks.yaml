# ./config's ExternalSecret needs the ExternalSecret CRD (from external-secrets, a
# separate component installed after cert-manager per PROJECT_BRIEF.md's order) --
# split so cert-manager-config can dependsOn both.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: cert-manager
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/cert-manager/cert-manager/app
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: cert-manager
  dependsOn:
    - name: cert-manager
    # external-secrets-config (not just external-secrets) -- this ExternalSecret
    # needs the ClusterSecretStore object to actually exist, not just its CRD.
    - name: external-secrets-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/cert-manager/cert-manager/config

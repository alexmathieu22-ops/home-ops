apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
  data:
    - secretKey: api-token
      remoteRef:
        # onepasswordSDK key format is <item>/[section/]<field> -- no separate
        # `property` field (that's the older Connect-provider syntax, confirmed against
        # https://external-secrets.io/latest/provider/1password-sdk/).
        key: cloudflare-api-token/credential

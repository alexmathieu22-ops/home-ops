# DEFERRED: needs the Cloudflare API token -- see docs/planning/PROJECT_BRIEF.md's "Deferred" list.
# Internal/VPN-only TLS only -- cloudflared terminates TLS at Cloudflare's edge for public traffic.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-dns01-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - alexandremathieu.com

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "1.18.x"
      sourceRef:
        kind: HelmRepository
        name: jetstack
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
    # DNS01 solver only — TLS for internal/VPN-only services. Public traffic terminates
    # TLS at Cloudflare's edge via the tunnel (kubernetes/apps/networking/cloudflared),
    # cert-manager doesn't need an HTTP01 solver/ingress-class here.
    extraArgs:
      - --dns01-recursive-nameservers-only
    # Without this, cert-manager never watches Gateway resources for the
    # cert-manager.io/cluster-issuer annotation -- the internal Gateway's https listener
    # (kubernetes/apps/networking/envoy-gateway/config/gateway-internal.yaml) referenced a
    # cert secret that was never created as a result, breaking TLS for every internal-only
    # route. RBAC for Gateway API resources is already unconditional in this chart version,
    # so no separate permission change is needed.
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      enableGatewayAPI: true

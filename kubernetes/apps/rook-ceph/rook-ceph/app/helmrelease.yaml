# Operator only -- CephCluster/pools/StorageClass are the rook-ceph-cluster chart, one
# level down (../cluster). Split for the CRD/CR-race reason in IMPLEMENTATION_NOTES.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    csi:
      serviceMonitor:
        enabled: false
    monitoring:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

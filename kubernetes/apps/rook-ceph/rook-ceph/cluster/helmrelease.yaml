# Hardware topology, replicated.size, and mon.allowMultiplePerNode rationale: see
# docs/adr/storage/0006-rook-ceph-topology-and-local-path-interim.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    cephClusterSpec:
      mon:
        count: 3
        # Local dev cluster needs this (see docs/adr/storage/0006-rook-ceph-topology-and-local-path-interim.md); harmless on real hardware.
        allowMultiplePerNode: true
      # See docs/adr/storage/0007-rook-ceph-node-drains-and-pdbs.md.
      disruptionManagement:
        managePodBudgets: false
      mgr:
        modules:
          - name: pg_autoscaler
            enabled: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
      network:
        connections:
          requireMsgr2: true
      # See docs/adr/storage/0008-rook-ceph-muted-health-warnings.md.
      healthCheck:
        muteHealthWarning:
          TOO_FEW_OSDS:
            policy: mute
          POOL_NO_REDUNDANCY:
            policy: mute
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
      # CVE-2025-30156 daemon key rotation -- see docs/adr/storage/0008-rook-ceph-muted-health-warnings.md.
      security:
        cephx:
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
      # Scaled down hard from upstream examples (often 8Gi+) -- 3x 16GB nodes running
      # the full infra+app stack alongside Ceph can't spare that much per OSD. Revisit
      # once real hardware is up and `ceph osd df` / actual usage is known.
      resources:
        mgr:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        mon:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        osd:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
      storage:
        useAllDevices: true
        useAllNodes: true
    # No Prometheus Operator CRDs at this point in the dependency chain (monitoring
    # depends on storage being ready, not the other way around) -- enable once both are
    # confirmed stable, if per-OSD metrics are actually needed.
    monitoring:
      enabled: false
    toolbox:
      enabled: true
    # Needs the external-snapshotter CRDs (VolumeSnapshotClass), not installed anywhere
    # in this repo yet.
    cephBlockPoolsVolumeSnapshotClass:
      enabled: false
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 1
        storageClass:
          enabled: true
          name: ceph-block
          # local-path-provisioner is the default StorageClass until real OSDs exist here.
          isDefault: false
          allowVolumeExpansion: true
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
          mountOptions:
            - discard
          parameters:
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-publish-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-publish-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            imageFeatures: layering
            imageFormat: "2"
    cephFileSystems: []
    cephObjectStores: []

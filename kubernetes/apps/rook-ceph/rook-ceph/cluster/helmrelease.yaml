# CURRENT REAL HARDWARE: home-ops-1 (HP ProDesk 600 G4 Mini) has one 256GB disk, entirely
# consumed by the Talos install -- zero spare block device, so it contributes no OSD.
# home-ops-2 (Asus VivoBook S510U) has a spare 1TB HDD (/dev/sda) wiped and handed to
# Rook via `useAllDevices: true` -- the only OSD in the cluster right now. With a single
# OSD host, `failureDomain: host` can only ever place 1 replica, so `cephBlockPools`
# below is deliberately `replicated.size: 1` (data-loss risk, single point of failure)
# rather than the usual 3 -- bump back up (2 once home-ops-1 gets a second disk, 3 once a
# 3rd OSD host exists) per HARDWARE_PLAN.md's node-2 notes. Same reason this can't be
# validated on the local dev cluster: Docker-provisioned Talos nodes have no raw block
# devices available either, so CephCluster will likely stay unhealthy there -- that's
# expected, not a bug (see README.md's local-cluster caveats).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    cephClusterSpec:
      mon:
        count: 3
        # Required for the local single-node Docker dev cluster (talosctl cluster create
        # docker --workers 0): Rook refuses to schedule 3 mons on fewer than 3 nodes
        # unless this is set, and without it the CephCluster gets permanently stuck
        # ("cannot start 3 mons on 1 node(s)"), blocking the whole HelmRelease's `--wait`
        # forever. Harmless to also carry into the real 3-node hardware config: Rook
        # still prefers spreading mons across distinct nodes when enough exist, this only
        # removes the hard block for when there aren't enough.
        allowMultiplePerNode: true
      mgr:
        modules:
          - name: pg_autoscaler
            enabled: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
      network:
        connections:
          requireMsgr2: true
      # TOO_FEW_OSDS and POOL_NO_REDUNDANCY are permanent given the single-OSD topology
      # above, not transient noise -- muting (not fixing) them is what makes HEALTH_OK
      # achievable for tuppr's health checks. Unmute both once a 2nd/3rd OSD host exists
      # and cephBlockPools' replicated.size below is bumped back up.
      healthCheck:
        muteHealthWarning:
          TOO_FEW_OSDS:
            policy: mute
          POOL_NO_REDUNDANCY:
            policy: mute
      # CVE-2025-30156 (weak integrity check on aes cephx service tickets): rotates the
      # core daemon keys (mon/mgr/osd) to the new aes256k cipher. One-off, not ongoing --
      # Ceph and Rook were already on CVE-fixed versions, only the keys hadn't rotated
      # yet. CSI/client keys deliberately stay on aes (unset below, chart default) since
      # our nodes run a kernel older than the 7.0+ AES256K requires.
      security:
        cephx:
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
      # Scaled down hard from upstream examples (often 8Gi+) -- 3x 16GB nodes running
      # the full infra+app stack alongside Ceph can't spare that much per OSD. Revisit
      # once real hardware is up and `ceph osd df` / actual usage is known.
      resources:
        mgr:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        mon:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        osd:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
      storage:
        useAllDevices: true
        useAllNodes: true
    # No Prometheus Operator CRDs at this point in the dependency chain (monitoring
    # depends on storage being ready, not the other way around) -- enable once both are
    # confirmed stable, if per-OSD metrics are actually needed.
    monitoring:
      enabled: false
    toolbox:
      enabled: true
    # Needs the external-snapshotter CRDs (VolumeSnapshotClass), not installed anywhere
    # in this repo yet.
    cephBlockPoolsVolumeSnapshotClass:
      enabled: false
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 1
        storageClass:
          enabled: true
          name: ceph-block
          # local-path-provisioner is the default StorageClass until real OSDs exist here.
          isDefault: false
          allowVolumeExpansion: true
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
          mountOptions:
            - discard
          parameters:
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-publish-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-publish-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            imageFeatures: layering
            imageFormat: "2"
    cephFileSystems: []
    cephObjectStores: []

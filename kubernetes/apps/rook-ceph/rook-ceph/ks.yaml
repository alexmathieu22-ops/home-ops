apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rook-ceph
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: rook-ceph
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/rook-ceph/rook-ceph/app
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rook-ceph-cluster
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: rook-ceph
  dependsOn:
    - name: rook-ceph
  # Not gated on CephCluster health -- see docs/adr/storage/0006-rook-ceph-topology-and-local-path-interim.md.
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/rook-ceph/rook-ceph/cluster

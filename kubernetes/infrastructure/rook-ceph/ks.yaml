apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rook-ceph
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: rook-ceph
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/rook-ceph/app
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rook-ceph-cluster
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: rook-ceph
  dependsOn:
    - name: rook-ceph
  # Deliberately not gating on CephCluster reaching HEALTH_OK/HEALTH_WARN here (unlike
  # some upstream examples): the local dev cluster has no raw block devices and never
  # will, and the real-hardware disk topology is an open question (see the caveat in
  # ./cluster/helmrelease.yaml) -- a hard health gate would block every downstream
  # Kustomization indefinitely in both cases. `wait: true` still waits for the
  # HelmRelease itself to install successfully.
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/rook-ceph/cluster

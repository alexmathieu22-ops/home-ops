# PLACEHOLDER RANGE — hardware/LAN not provisioned yet (PROJECT_BRIEF.md "Deferred").
# Update to a small, unused slice of the real LAN subnet once the 3x Beelink nodes are
# on the network, e.g. the last ~20 addresses of the home /24.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: internal
spec:
  blocks:
    - start: "192.168.1.200"
      stop: "192.168.1.220"

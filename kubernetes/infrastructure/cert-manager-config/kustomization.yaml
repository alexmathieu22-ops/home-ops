# Split from kubernetes/infrastructure/cert-manager: the ExternalSecret here needs the
# ExternalSecret CRD, which comes from external-secrets -- a component that (per
# PROJECT_BRIEF.md's stated order) is installed *after* cert-manager's own controller.
# This Kustomization dependsOn both (kubernetes/flux/cluster/infrastructure.yaml), same
# reasoning as the cilium/cilium-config split.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - clusterissuer.yaml
  - externalsecret.yaml

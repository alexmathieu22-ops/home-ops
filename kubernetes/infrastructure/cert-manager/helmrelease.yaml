apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "1.18.x"
      sourceRef:
        kind: HelmRepository
        name: jetstack
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
    # DNS01 solver only — TLS for internal/VPN-only services. Public traffic terminates
    # TLS at Cloudflare's edge via the tunnel (kubernetes/infrastructure/cloudflared),
    # cert-manager doesn't need an HTTP01 solver/ingress-class here.
    extraArgs:
      - --dns01-recursive-nameservers-only

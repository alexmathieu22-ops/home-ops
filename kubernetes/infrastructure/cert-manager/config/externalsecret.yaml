# DEFERRED: Cloudflare account/domain don't exist yet (PROJECT_BRIEF.md). This will stay
# in a failing/pending state — the referenced 1Password item doesn't exist — until both
# 1Password (external-secrets component) and Cloudflare are set up. Fill in the real
# vault/item path once they are.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare-api-token # 1Password item name, TODO once vault exists
        property: credential

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  retryInterval: 2m
  prune: true
  wait: true
  targetNamespace: monitoring
  dependsOn:
    - name: rook-ceph-cluster
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/monitoring/app

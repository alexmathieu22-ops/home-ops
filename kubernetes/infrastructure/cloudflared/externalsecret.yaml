# DEFERRED: no Cloudflare account/tunnel yet (PROJECT_BRIEF.md). Create the tunnel
# (`cloudflared tunnel create home-ops`), store its token in this 1Password item, and
# configure public hostnames -> Kubernetes Services in the Cloudflare Zero Trust
# dashboard (Networks > Tunnels) — that's what "routes by hostname, not DNS records
# pointing at an IP" means; no config.yml/ingress ConfigMap needed here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel-token
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: cloudflared-tunnel-token
  data:
    - secretKey: token
      remoteRef:
        key: cloudflared-tunnel-token # 1Password item name, TODO once vault exists
        property: credential

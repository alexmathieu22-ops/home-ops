# Internal/VPN-only ingress — reachable via the Headscale subnet router, never exposed
# publicly (that's cloudflared's job). Envoy Gateway provisions a LoadBalancer Service
# for this; Cilium LB-IPAM (kubernetes/infrastructure/cilium/ippool.yaml) assigns it an
# IP from the internal pool automatically.
#
# TODO: replace the placeholder hostname once a real domain exists (PROJECT_BRIEF.md
# "Deferred") — matches the ClusterIssuer's DNS zone in
# kubernetes/infrastructure/cert-manager/clusterissuer.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: envoy-gateway-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.replace-me.example.com"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.replace-me.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: internal-gateway-tls
      allowedRoutes:
        namespaces:
          from: All

# DEFERRED: Headscale server hosting location (Oracle Free Tier vs. home) is pending a
# CGNAT check (PROJECT_BRIEF.md), so it isn't deployed anywhere yet — it's standalone
# infra outside this cluster by design (the front door to the tailnet shouldn't depend
# on the cluster it fronts), not a HelmRelease here. Once it exists: generate a
# pre-auth key (`headscale preauthkeys create --reusable --expiration 24h`), store it
# in this 1Password item, and set the real login-server URL below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-subnet-router-authkey
  namespace: headscale-subnet-router
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: headscale-subnet-router-authkey
  data:
    - secretKey: authkey
      remoteRef:
        key: headscale-subnet-router-authkey # 1Password item name, TODO once vault exists
        property: credential

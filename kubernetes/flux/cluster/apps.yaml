apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  dependsOn:
    - name: longhorn
    - name: external-secrets
    - name: envoy-gateway
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps

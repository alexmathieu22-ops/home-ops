# The only two Kustomizations defined centrally -- everything else (per-component
# ordering/dependsOn) lives colocated in each component's own ks.yaml under
# kubernetes/infrastructure/<name>/ and kubernetes/apps/<name>/, matching
# onedr0p/home-ops and buroa/k8s-gitops's convention. These two just point
# kustomize-controller at the two top-level trees; the nested ks.yaml files (applied as
# part of the same sync, since they're just YAML from kustomize's point of view) do the
# real fan-out and dependency chaining.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 1h
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1h
  prune: true
  wait: false
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps

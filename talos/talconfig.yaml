# talhelper config -- source of truth for Talos machine configs on real hardware.
# Not used for the local dev cluster (`talosctl cluster create docker` generates its
# own config; see docs/runbooks/cluster-bootstrap.md).
#
# home-ops-1: HP ProDesk 600 G4 Mini, sole control-plane node. 8GB RAM and a single
# 256GB NVMe (fully consumed by the OS install, no spare disk for Rook-Ceph OSDs) --
# a RAM upgrade or second M.2 SSD are the easy fixes if either becomes a bottleneck.
# home-ops-2: Asus VivoBook S510U, worker-only node.
---
clusterName: home-ops

# The actual running version is driven live by tuppr (kubernetes/apps/system-upgrade),
# not by applying this file -- tuppr version-swaps each node's current install image
# over the Talos API directly. These two just need to stay in sync so a from-scratch
# reinstall doesn't provision an older baseline than what's actually running.
talosVersion: v1.13.9
kubernetesVersion: v1.36.3

# No VIP: only one control-plane node, so this points directly at it.
endpoint: https://192.168.18.39:6443

# home-ops-1 is the only control-plane node, so it must keep scheduling workloads too.
allowSchedulingOnControlPlanes: true

# Cilium (installed via Flux HelmRelease) replaces Talos's bundled CNI + kube-proxy.
cniConfig:
  name: none

# Applies to every node, control-plane and worker alike.
patches:
  # Cilium replaces kube-proxy; Talos must not install its own.
  - |-
    cluster:
      proxy:
        disabled: true
  # cloudflared's QUIC transport needs bigger UDP buffers than the kernel default.
  - |-
    machine:
      sysctls:
        net.core.rmem_max: "67108864"
        net.core.wmem_max: "67108864"
  # local-path-provisioner PVCs: Talos's rootfs is read-only, only /var persists.
  # Re-apply after changing this (`talhelper genconfig` then `gencommand apply`) --
  # Flux can't push machine config.
  - |-
    machine:
      kubelet:
        extraMounts:
          - destination: /var/local-path-provisioner
            type: bind
            source: /var/local-path-provisioner
            options:
              - bind
              - rshared
              - rw

# Talos only allows kubernetesTalosAPIAccess on control-plane machines; this is
# enough for the whole cluster since it's the kube-apiserver-side extension that
# matters, not a per-node gate. Grants system-upgrade namespace os:admin Talos API
# access, needed by tuppr.
controlPlane:
  patches:
    - |-
      machine:
        features:
          kubernetesTalosAPIAccess:
            enabled: true
            allowedRoles:
              - os:admin
            allowedKubernetesNamespaces:
              - system-upgrade

nodes:
  # HP ProDesk 600 G4 Mini. Only disk is /dev/nvme0n1 (256GB).
  - hostname: home-ops-1
    ipAddress: 192.168.18.39
    installDiskSelector:
      size: ">= 100GB"
    controlPlane: true

  # Asus VivoBook S510U. Worker-only: a 2-node etcd cluster has worse fault tolerance
  # than 1-node (needs both members up), so promote only once a 3rd node exists.
  # Two disks (1TB HDD + 256GB SSD) need a model selector; installs to the SSD.
  - hostname: home-ops-2
    ipAddress: 192.168.18.41
    installDiskSelector:
      model: Micron_1100_MTFD
    controlPlane: false

# talhelper config — source of truth for Talos machine configs. Not currently applied to
# the local dev cluster (talosctl cluster create docker generates its own config, see
# docs/runbooks/cluster-bootstrap.md) -- this is the real-hardware source of truth.
#
# Current setup: a single HP ProDesk 600 G4 Mini (i5-8500T, 8GB RAM, 256GB SSD), running
# single-node. When more nodes are added later, append them to the `nodes:` block below;
# nothing else in this file needs to change -- allowSchedulingOnControlPlanes is already
# required for single-node scheduling and stays harmless once more nodes exist.
#
# Known caveats from this specific box, tracked here rather than silently ignored:
#   - 8GB RAM is on the low side for the full stack. Expect to feel this once Rook-Ceph +
#     observability + a couple of apps are all running. HP ProDesk 600 G4 Mini takes 2x
#     DDR4 SODIMM up to 32GB total; a cheap RAM upgrade is the easiest lever if things get
#     tight.
#   - Single 256GB NVMe (confirmed: /dev/nvme0n1, Toshiba KBG30ZMV256G), all of it needed
#     for the Talos/OS install -- there's no spare raw block device for Rook-Ceph OSDs
#     (see kubernetes/apps/rook-ceph/rook-ceph/cluster/helmrelease.yaml's caveat). The box
#     has a second, empty M.2 slot -- a cheap second M.2 SSD there is the cleanest fix
#     (needs the 2.5" drive carrier removed for clearance if using both).
---
clusterName: home-ops

talosVersion: v1.13.8
kubernetesVersion: v1.36.3

# No LB/VIP in front of the control plane -- moot with one node anyway, and even once
# node 2/3 exist this repo hasn't added a VIP (not in scope per PROJECT_BRIEF.md). Points
# at the control-plane node directly; talhelper adds every node in `nodes:` to the
# generated talosconfig's `nodes:` list for talosctl access regardless.
endpoint: https://192.168.18.39:6443

# Single node must schedule regular workloads too (no dedicated worker capacity yet).
# All nodes run as control-plane (HA etcd, no node purely dedicated to control-plane) --
# stays true once more nodes are added.
allowSchedulingOnControlPlanes: true

# Cilium is installed via Flux HelmRelease (kubernetes/apps/kube-system/cilium), not
# Talos's bundled Flannel — same reason kube-proxy is disabled below.
cniConfig:
  name: none

controlPlane:
  patches:
    # Cilium replaces kube-proxy (kube-proxy-replacement); Talos must not install it.
    - |-
      cluster:
        proxy:
          disabled: true
    # cloudflared's QUIC transport needs bigger UDP buffers than the kernel default
    # (observed warning: "wanted: 7168 kiB, got: 416 kiB", causing periodic reconnects).
    - |-
      machine:
        sysctls:
          net.core.rmem_max: "67108864"
          net.core.wmem_max: "67108864"

nodes:
  # HP ProDesk 600 G4 Mini. Real LAN is 192.168.18.0/24 (confirmed from the node's own
  # console during install, not 192.168.1.0/24 as earlier placeholders assumed). IP below
  # is reserved for this box's MAC in the router's DHCP settings (see
  # docs/runbooks/cluster-bootstrap.md for why a reservation beats a Talos-side static IP
  # here) -- keep it outside the Cilium LB-IPAM pool range
  # (kubernetes/apps/kube-system/cilium/config/ippool.yaml).
  #
  # installDiskSelector (not installDisk: /dev/sdX): `talosctl get disks -n 192.168.18.39
  # --insecure` confirmed the SSD is /dev/nvme0n1 (256GB Toshiba KBG30ZMV256G) -- the only
  # other disk visible is the 16GB USB install stick itself (/dev/sda), which the
  # ">= 100GB" size filter correctly excludes. Kept as a selector rather than hardcoding
  # `/dev/nvme0n1` since it's just as unambiguous here and survives a disk swap.
  - hostname: home-ops-1
    ipAddress: 192.168.18.39
    installDiskSelector:
      size: ">= 100GB"
    controlPlane: true

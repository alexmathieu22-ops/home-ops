# talhelper config — source of truth for Talos machine configs. Not currently applied to
# the local dev cluster (talosctl cluster create docker generates its own config, see
# docs/runbooks/cluster-bootstrap.md) -- this is the real-hardware source of truth. When
# the 3x Beelink EQ12 Pro nodes arrive, only the `nodes:` block below needs to change --
# hostnames/IPs swap to the real LAN, installDisk swaps to the real NVMe device,
# everything else (CNI disabled for Cilium, allowSchedulingOnControlPlanes, etc.) stays
# as-is.
---
clusterName: home-ops

talosVersion: v1.13.7
kubernetesVersion: v1.36.2

# No LB/VIP in front of the control plane yet (not in scope per PROJECT_BRIEF.md) —
# points at the first control-plane node directly. talhelper still adds all three
# node IPs to the generated talosconfig's `nodes:` list for talosctl access.
endpoint: https://10.5.0.2:6443

# All 3 nodes are control-plane (HA etcd quorum, no dedicated workers at this scale).
allowSchedulingOnControlPlanes: true

# Cilium is installed via Flux HelmRelease (kubernetes/apps/kube-system/cilium), not
# Talos's bundled Flannel — same reason kube-proxy is disabled below.
cniConfig:
  name: none

controlPlane:
  patches:
    # Cilium replaces kube-proxy (kube-proxy-replacement); Talos must not install it.
    - |-
      cluster:
        proxy:
          disabled: true
    # cloudflared's QUIC transport needs bigger UDP buffers than the kernel default
    # (observed warning: "wanted: 7168 kiB, got: 416 kiB", causing periodic reconnects).
    - |-
      machine:
        sysctls:
          net.core.rmem_max: "67108864"
          net.core.wmem_max: "67108864"

nodes:
  - hostname: home-ops-dev-cp-1
    ipAddress: 10.5.0.2
    installDisk: /dev/vda
    controlPlane: true
  - hostname: home-ops-dev-cp-2
    ipAddress: 10.5.0.3
    installDisk: /dev/vda
    controlPlane: true
  - hostname: home-ops-dev-cp-3
    ipAddress: 10.5.0.4
    installDisk: /dev/vda
    controlPlane: true

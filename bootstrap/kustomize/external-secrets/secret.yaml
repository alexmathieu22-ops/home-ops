# Secret zero: the one Kubernetes Secret not managed by ExternalSecret -> 1Password,
# because it's what ESO itself needs to bootstrap that connection. `op://` gets
# substituted with the real value by `op inject` before this ever reaches kubectl --
# nothing here is a real secret at rest in Git. See docs/runbooks/secret-zero.md.
apiVersion: v1
kind: Secret
metadata:
  name: onepassword-service-account-token
  namespace: external-secrets
stringData:
  token: op://home-ops/eso-service-account/token
